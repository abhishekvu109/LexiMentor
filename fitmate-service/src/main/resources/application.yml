spring:
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:async-jobs-schema.sql
  data:
    mongodb:
      uri: mongodb://${MONGODB_USERNAME:mongoroot}:${MONGODB_PASSWORD:mongopass}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:fitmate}?authSource=admin
      database: ${MONGODB_DATABASE:fitmate}
      username: ${MONGODB_USERNAME:mongoroot}
      password: ${MONGODB_PASSWORD:mongopass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
  datasource:
    username: ${MYSQL_USER:abhishek}
    password: ${MYSQL_PASSWORD:abhishek}
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:abhishek}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      idle-timeout: 60000
      maximum-pool-size: 50
  application:
    name: fitmate-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true
server:
  port: ${SERVICE_PORT:9393}

resource:
  path: D:/fitmate

fitmate:
  ai:
    ollama:
      url: ${OLLAMA_URL:http://192.168.1.90:11434/api/generate}
      model: ${OLLAMA_MODEL:ministral-3:3b}
  ml-service:
    # Base URL of the Python FastAPI ML microservice (fitmate-ml).
    # Override via env var ML_SERVICE_URL in production / Docker Compose.
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
    # TCP connect timeout — fail fast if the Python process is not reachable
    connect-timeout-ms: 3000
    # Full response timeout — XGBoost inference is fast (< 100 ms) even on CPU
    read-timeout-ms: 10000

async:
  jobs:
    store-type: jdbc
    table-name: async_jobs
    api-enabled: true
    api-base-path: /api/fitmate/async-jobs
