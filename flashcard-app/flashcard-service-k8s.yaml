# Apply the environment config
apiVersion: v1
kind: ConfigMap
metadata:
  name: flashcard-config
  labels:
    app: flashcard-app
data:
  SERVICE_PORT: "6060"
  MYSQL_HOST: "mysql-service-k8s.default.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "flashcard"
  SERVICE_NAME: "flashcard-service-k8s.default.svc.cluster.local"

---

# Apply the deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcard-deployment-k8s
spec:
  selector:
    matchLabels:
      app: flashcard-app
  replicas: 1
  template:
    metadata:
      labels:
        app: flashcard-app
    spec:
      containers:
        - name: flashcard-app
          image: localhost:5000/flashcard-service:latest
          env:
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: flashcard-config
                  key: SERVICE_PORT
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: flashcard-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: flashcard-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: flashcard-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-user-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-user-secret
                  key: password
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: flashcard-config
                  key: SERVICE_NAME
          imagePullPolicy: Always
          ports:
            - containerPort: 6060
#      imagePullSecrets:
#        - name: my-registry-secret

---

# Adding the service
apiVersion: v1
kind: Service
metadata:
  name: flashcard-service-k8s
spec:
  selector:
    app: flashcard-app
  ports:
    - port: 6060
      targetPort: 6060
  type: ClusterIP
