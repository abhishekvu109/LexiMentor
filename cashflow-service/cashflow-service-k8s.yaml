#Apply the environment dependency
apiVersion: v1
kind: ConfigMap # Resource type
metadata:
  name: cashflow-config
  labels:
    app: cashflow-app
data:
  SERVICE_PORT: "1515"
  MYSQL_HOST: "mysql-service-k8s.default.svc.cluster.local"
  MYSQL_PORT: "3306"
  SERVICE_NAME: "cashflow-service-k8s.default.svc.cluster.local"
  JWT_SECRET: "W09fL1VDmiTpolPS1M4yd/Ipnyu/ZQLDEA875WQWMfM="

---

# Apply the deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cashflow-deployment-k8s
spec:
  selector:
    matchLabels:
      app: cashflow-app
  replicas: 1
  template:
    metadata:
      labels:
        app: cashflow-app
    spec:
      containers:
        - name: cashflow-app
          image: localhost:5000/cashflow-service:latest
          env:
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: cashflow-config
                  key: SERVICE_PORT
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: cashflow-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_PORT
                  name: cashflow-config
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: mysql-user-secret
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: mysql-user-secret
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  key: SERVICE_NAME
                  name: cashflow-config
          imagePullPolicy: Always
          ports:
            - containerPort: 1515
#      imagePullSecrets:
#        - name: my-registry-secret

---

# Adding the service

apiVersion: v1
kind: Service
metadata:
  name: cashflow-service-k8s
spec:
  selector:
    app: cashflow-app
  ports:
    - port: 1515
      targetPort: 1515
  type: ClusterIP